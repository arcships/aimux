[package]
name = "aimux-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "aimux Web 控制台 — 浏览器端的 model call 验证与 trace 可视化 (RFC-0029)"
keywords = ["llm", "ai", "console", "web", "debug"]
categories = ["command-line-utilities"]
documentation = "https://docs.rs/aimux-web"

[lib]
path = "src/lib.rs"

[[bin]]
name = "aimux-web"
path = "src/main.rs"
required-features = ["console"]

[features]
default = ["console"]
# The axum console. Codegen depends on this crate with default-features off
# so it only compiles the wire DTOs.
console = [
    "dep:aimux-providers",
    "dep:tokio",
    "dep:anyhow",
    "dep:futures",
    "dep:async-stream",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:clap",
]
# Release / distribution builds: embed the built frontend (web/dist) into the
# binary so users get a self-contained console with no npm step. Requires
# `web/dist` to exist at compile time (run `npm run build` first). Dev builds
# (default) keep serving from disk so the frontend can hot-reload.
embed-frontend = ["console", "dep:rust-embed"]

[dependencies]
aimux-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
aimux-providers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
rust-embed = { version = "8", optional = true, features = ["mime-guess"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
