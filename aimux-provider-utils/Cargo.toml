[package]
name = "aimux-provider-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared utilities for aimux provider implementations"
keywords = ["llm", "http", "ai", "api"]
categories = ["api-bindings", "asynchronous"]
documentation = "https://docs.rs/aimux-provider-utils"

[dependencies]
aimux-core = { workspace = true }
aimux-stream = { workspace = true }

reqwest = { workspace = true }
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
url = { workspace = true }
chrono = "0.4"

# WebSocket client (RFC-0028 realtime transcription). Optional: enabled via
# the `ws` feature so consumers without realtime needs compile it out.
tokio-tungstenite = { workspace = true, optional = true }

[features]
ws = ["dep:tokio-tungstenite"]

[dev-dependencies]
aimux-core = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt", "time"] }
serial_test = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
