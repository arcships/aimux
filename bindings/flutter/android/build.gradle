// Packages the Rust ABI and builds the Flutter credit/finalizer transport.

group = 'ai.arcships'
version = '0.2.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'ai.arcships.aimux'
    compileSdk 34
    externalNativeBuild {
        cmake { path '../native/CMakeLists.txt' }
    }

    defaultConfig {
        minSdk 21
        externalNativeBuild {
            cmake { arguments '-DCMAKE_BUILD_TYPE=Release' }
        }
    }
}
