name: aimux
description: Unified LLM service layer for Flutter/Dart (Rust core, 325 providers, C ABI via dart:ffi)
version: 0.3.0
homepage: https://github.com/arcships/aimux
repository: https://github.com/arcships/aimux
issue_tracker: https://github.com/arcships/aimux/issues
topics:
  - ai
  - llm
  - ffi

environment:
  sdk: ^3.4.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  test: ^1.25.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.0

# Flutter plugin — the Rust core (aimux-ffi) ships inside the package:
#   - Android: libaimux_ffi.so per ABI under android/src/main/jniLibs
#   - iOS:     aimux_ffi.xcframework (SwiftPM + CocoaPods)
# No platform channels — dart:ffi calls the C ABI directly.
flutter:
  plugin:
    platforms:
      ios:
        # Both pluginClass and dartPluginClass: the (empty) native class makes
        # Flutter add the plugin to the Podfile, which is what installs the
        # podspec with its vendored xcframework + force_load. Without it,
        # dartPluginClass-only plugins never reach pod install.
        pluginClass: AimuxPlugin
        dartPluginClass: AimuxPlugin
      android:
        # Same pattern as iOS: the (empty) native class wires the plugin into
        # the Gradle build, which packages jniLibs/*/libaimux_ffi.so into the APK.
        pluginClass: AimuxPlugin
        dartPluginClass: AimuxPlugin
