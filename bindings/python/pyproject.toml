[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "aimux"
version = "0.1.0"
description = "Unified LLM service layer for Python (Rust core, 172+ providers)"
license = "MIT"
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
