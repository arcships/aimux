[package]
name = "aimux-python"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Python binding for aimux (PyO3, native path — bypasses aimux-ffi)"

[lib]
name = "aimux"
crate-type = ["cdylib"]

[features]
contract-tests = []

[dependencies]
aimux-core = { path = "../../aimux-core" }
aimux-ops = { path = "../../aimux-ops" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.22"

# Keep out of main workspace
[workspace]

# Size profile for the shipped extension (RFC-0043 §12 B-profile, #374 §15.8).
# Cargo's default release (opt 3, no LTO) builds a 39.5 MB library; `maturin
# publish` strips it, so the wheel shipped 30.6 MB. This profile ships 17.3 MB
# with the same six benchmark scenarios within noise of the old build
# (opt-level "z" was 28-35% slower on large responses, so "s"). `panic` stays
# "unwind": PyO3 catches a panic at the boundary and raises PanicException;
# abort would kill the host.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
