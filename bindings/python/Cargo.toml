[package]
name = "aimux-python"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Python binding for aimux (PyO3, native path — bypasses aimux-ffi)"

[lib]
name = "aimux"
crate-type = ["cdylib"]

[features]
contract-tests = []

[dependencies]
aimux-core = { path = "../../aimux-core" }
aimux-ops = { path = "../../aimux-ops" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.22"

# Keep out of main workspace
[workspace]
