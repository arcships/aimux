[package]
name = "aimux-node"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Node.js binding for aimux (napi-rs, native path — bypasses aimux-ffi)"

[lib]
crate-type = ["cdylib"]

[features]
contract-tests = []

[dependencies]
aimux-core = { path = "../../aimux-core" }
aimux-ops = { path = "../../aimux-ops" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
napi = { version = "3", features = ["napi8", "tokio_rt", "async", "serde-json"] }
napi-derive = "3"

# Keep this crate out of the main cargo workspace — napi-rs builds it independently.
[workspace]

# Size profile for the shipped extension (RFC-0043 §12 B-profile, #374 §15.8).
# Cargo's default release (opt 3, no LTO, unstripped) shipped a 39.9 MB
# library; this profile ships 17.4 MB with the same six benchmark scenarios
# within noise of the old build (opt-level "z" was 28-35% slower on large
# responses, so "s"). `panic` stays "unwind": napi-rs catches a
# panic at the boundary and raises a JS exception; abort would kill the host.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
