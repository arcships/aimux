[package]
name = "aimux-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core abstractions for aimux: LanguageModel trait, message types, and user-facing API"
keywords = ["llm", "ai", "openai", "anthropic", "provider"]
categories = ["api-bindings", "asynchronous"]
documentation = "https://docs.rs/aimux-core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true }
# Core also resolves generated file URLs before exposing file outputs.
tokio = { version = "1", features = ["time", "macros", "rt", "sync", "net"] }
reqwest = { workspace = true }
url = { workspace = true }
tokio-util = "0.7"
httpdate = { workspace = true }
rand = { workspace = true }
base64 = "0.22"
jsonschema = { workspace = true }
regex = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
