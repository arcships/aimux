[package]
name = "aimux-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core types for aimux (arcships): in-process LLM access, LanguageModel, and AI SDK V4 JSON shapes"
keywords = ["llm", "ai", "openai", "sdk", "provider"]
categories = ["api-bindings", "asynchronous"]
documentation = "https://docs.rs/aimux-core"

[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
# Core also resolves generated file URLs before exposing file outputs.
tokio = { version = "1", features = ["time", "macros", "rt", "sync", "net"] }
reqwest = { workspace = true }
url = { workspace = true }
tokio-util = "0.7"
httpdate = { workspace = true }
rand = { workspace = true }
base64 = "0.22"
# `Timestamp`: RFC 3339 parsing and `toISOString` formatting.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
jsonschema = { workspace = true }
regex = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
