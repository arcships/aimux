[package]
name = "aimux-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI boundary for aimux multi-language bindings (opaque handle + push stream)"
keywords = ["llm", "ffi", "c-abi", "bindings"]
categories = ["api-bindings", "asynchronous", "development-tools::ffi"]
documentation = "https://docs.rs/aimux-ffi"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aimux-ops = { path = "../aimux-ops", version = "0.5.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
aimux-core = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
