[package]
name = "aimux-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI boundary for aimux multi-language bindings (opaque handle + push stream)"
keywords = ["llm", "ffi", "c-abi", "bindings"]
categories = ["api-bindings", "asynchronous", "development-tools::ffi"]
documentation = "https://docs.rs/aimux-ffi"

[lib]
# Produce linkable artifacts for C ABI consumers
# (C/C++, Go, Kotlin, Java, Swift, and Flutter).
# `rlib` lets other Rust crates depend on this crate too.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aimux-core = { workspace = true }
aimux-providers = { workspace = true }
aimux-provider-utils = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# Needed to drive `Stream::next` while consuming `stream_text` output.
futures = { workspace = true }
# Mock transcription stream construction in tests (RFC-0028).
async-stream = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
