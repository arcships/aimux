name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust core: fmt + clippy + tests (single OS — cassettes are platform-agnostic) ──
  rust-test:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace

  # ── Node binding: build all desktop targets, test on native hosts ───────────
  node-binding:
    name: Node binding (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            binary: aimux.win32-x64-msvc.node
            test: true
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            binary: aimux.win32-arm64-msvc.node
            test: false
          - host: macos-15-intel
            target: x86_64-apple-darwin
            binary: aimux.darwin-x64.node
            test: true
          - host: macos-latest
            target: aarch64-apple-darwin
            binary: aimux.darwin-arm64.node
            test: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: aimux.linux-x64-gnu.node
            test: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: aimux.linux-arm64-gnu.node
            test: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build Linux (glibc 2.17 baseline)
        if: contains(matrix.settings.target, 'unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        env:
          TARGET_CC: clang
          TARGET_CXX: clang++
        run: npx napi build --platform --target ${{ matrix.settings.target }} --use-napi-cross
      - name: Build
        if: ${{ !contains(matrix.settings.target, 'unknown-linux-gnu') }}
        working-directory: bindings/node
        shell: bash
        run: npx napi build --platform --target ${{ matrix.settings.target }}
      - name: Verify artifact
        working-directory: bindings/node
        shell: bash
        run: test -f '${{ matrix.settings.binary }}'
      - name: Verify glibc baseline
        if: contains(matrix.settings.target, 'unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        run: |
          highest=$(readelf --version-info '${{ matrix.settings.binary }}' | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          test -n "$highest"
          test "$(printf '%s\n' GLIBC_2.17 "$highest" | sort -V | tail -1)" = GLIBC_2.17
      - name: Verify static Windows CRT
        if: contains(matrix.settings.target, 'windows-msvc')
        working-directory: bindings/node
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ tools not found' }
          $toolsVersion = (Get-Content "$install\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $targetArch = if ('${{ matrix.settings.target }}' -like 'aarch64-*') { 'arm64' } else { 'x64' }
          $dumpbin = "$install\VC\Tools\MSVC\$toolsVersion\bin\Hostx64\$targetArch\dumpbin.exe"
          $dependencies = & $dumpbin /DEPENDENTS '${{ matrix.settings.binary }}' | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          if ($dependencies -match '(?im)^\s*(?:VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt)[^\s]*\.dll\s*$') {
            throw "Dynamic MSVC runtime dependency found:`n$dependencies"
          }
      - name: Test
        if: matrix.settings.test
        working-directory: bindings/node
        run: npm test
      - name: Typecheck typed wrapper (tsc)
        if: matrix.settings.test
        working-directory: bindings/node
        run: npm run build:typed
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.settings.target }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts

  # ── Python binding: build + test (single OS — wheels built per-OS at release) ──
  python-binding:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin[patchelf]"
      - name: Build
        working-directory: bindings/python
        shell: bash
        run: |
          maturin build --release
          pip install --force-reinstall target/wheels/*.whl
      - name: Test
        working-directory: bindings/python
        run: |
          pip install pytest pydantic
          python -m pytest tests/ -v

  # ── aimux-ffi: build C ABI library (desktop matrix — source for C/C++ artifacts) ──
  ffi-build:
    name: aimux-ffi (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libaimux_ffi.so
          - host: macos-latest
            target: aarch64-apple-darwin
            artifact: libaimux_ffi.dylib
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aimux_ffi.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build cdylib
        run: cargo build -p aimux-ffi --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            aimux-ffi/aimux-ffi.h

  # ── Java binding: build FFI lib + test across JDK versions ─────────────────
  # Gradle 8.14.3 runs on JDK 8+; the build script only sets --release on JDK 9+,
  # so the Java 8 matrix entry compiles with plain source/target compatibility.
  java-binding:
    name: Java binding (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build FFI library
        run: cargo build -p aimux-ffi --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Test
        working-directory: bindings/java
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: gradle test

  # ── Go binding: build FFI static archive + vet/test ───────────────────────
  go-binding:
    name: Go binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS included because the cgo LDFLAGS are platform-specific
        # (ld64 rejects GNU -Bstatic/-Bdynamic; see bindings/go/aimux.go).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build static archive
        run: cargo build -p aimux-ffi --release
      - name: Vet + test Go binding
        working-directory: bindings/go
        shell: bash
        run: |
          export CGO_LDFLAGS="-L${{ github.workspace }}/target/release"
          go vet ./...
          go test ./...

  # ── Contract tests: shared JSON fixtures (catches cross-language type drift) ──
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Rust contract tests
        run: cargo test --test contract_test -p aimux-core
      - name: Build Node binding
        working-directory: bindings/node
        run: |
          npm ci
          npx napi build --platform
      - name: Run Node contract tests
        working-directory: contract-tests
        run: |
          node --experimental-strip-types run-node.ts
