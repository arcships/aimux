name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust core: fmt + clippy + tests (single OS — cassettes are platform-agnostic) ──
  rust-test:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace

  # ── Node binding: build + test (main platforms) ─────────────────────────────
  node-binding:
    name: Node binding (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: bindings/node
        run: npm install
      - name: Build
        working-directory: bindings/node
        shell: bash
        run: |
          npx napi build --platform --target ${{ matrix.settings.target }}
          ls -la *.node 2>/dev/null || echo "WARNING: No .node files in root"
      - name: Test
        working-directory: bindings/node
        run: npm test
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.settings.target }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts

  # ── Python binding: build + test (single OS — wheels built per-OS at release) ──
  python-binding:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin[patchelf]"
      - name: Build
        working-directory: bindings/python
        shell: bash
        run: |
          maturin build --release
          pip install --force-reinstall target/wheels/*.whl
      - name: Test
        working-directory: bindings/python
        run: |
          pip install pytest pydantic
          python -m pytest tests/ -v

  # ── aimux-ffi: build C ABI library (desktop matrix — source for C/C++ artifacts) ──
  ffi-build:
    name: aimux-ffi (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libaimux_ffi.so
          - host: macos-latest
            target: aarch64-apple-darwin
            artifact: libaimux_ffi.dylib
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aimux_ffi.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build cdylib
        run: cargo build -p aimux-ffi --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            aimux-ffi/aimux-ffi.h

  # ── Contract tests: shared JSON fixtures (catches cross-language type drift) ──
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Rust contract tests
        run: cargo test --test contract_test -p aimux-core
      - name: Build Node binding
        working-directory: bindings/node
        run: |
          npm install
          npx napi build --platform
      - name: Run Node contract tests
        working-directory: contract-tests
        run: |
          node --experimental-strip-types run-node.ts
