name: CI

on:
  push:
    branches: [master]
  # Every pull request runs the checks, whatever its base: stacked PRs are
  # reviewed against the PR below them.
  pull_request:

# A new push to a pull request cancels its older run. Pushes to master each
# get their own group: GitHub cancels a pending run in a group when another
# one queues, and "changes" only diffs a push against the one before it, so a
# documentation push queued behind a cancelled code push would leave that
# code untested on master.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Test-only jobs do not ship binaries: skip single-threaded fat LTO and -Oz
  # size optimization. ffi-build uploads release artifacts and restores
  # Cargo.toml's release profile in its job env.
  # opt-level 1, not 0: aimux_stream_text drives the whole stream future on
  # the caller's thread, and at opt-level 0 that needs more than the 512 KB
  # stack of a Swift cooperative thread (SIGBUS in the async Swift tests).
  # Measured for one stream through the C ABI: ~530 KB at 0, ~110 KB at 1,
  # ~160 KB with the shipping profile.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_IOS_RELEASE_OPT_LEVEL: "z"
  CARGO_PROFILE_IOS_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # Decides once which jobs a change needs and where they run. "CI result" at
  # the end always runs and reports it, so a check required by branch
  # protection never waits on a skipped workflow (RFC-0043 §9.2).
  #
  # What runs, on a pull request:
  # - Documentation only (top-level Markdown, docs/, rfc/, assets/): nothing.
  #   docs/api/providers.md is generated and checked, so it counts as code.
  # - Only inside bindings/<name>/: that binding's jobs. The Rust workspace
  #   does not read the bindings, so nothing else can break.
  # - aimux-ffi/: the Rust jobs and every binding that links the C ABI. Node
  #   and Python link the Rust crates directly, not the C ABI. Go is tested
  #   inside ffi-build, Java and Kotlin share one job.
  # - Anything else (the Rust crates, tools, scripts, contract fixtures,
  #   Cargo manifests, workflows): every job.
  # Generator drift checks run for any code change: they check generated
  # files that live in every binding.
  #
  # Where it runs, on a pull request: the Rust code is platform-neutral
  # (rustls, no platform cfg outside tools/), so jobs run on Linux, and the
  # macOS and Windows legs are added only when the change touches what differs
  # per platform: the C ABI, the Node, Go, Flutter or Swift bindings, a Cargo
  # manifest (dependencies), a build script, line-ending rules
  # (.gitattributes), the toolchain or the workflows.
  # Shared Rust changes still get one Windows leg (Node x64 tests); Swift
  # tests are macOS-only and run whenever they are needed: they
  # drive the C ABI from async Swift, which caught a stack overflow no Linux
  # job hit.
  #
  # Pushes to master, and runs with no base to compare with, run everything.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      run: ${{ steps.diff.outputs.run }}
      node-legs: ${{ steps.legs.outputs.node }}
      ffi-legs: ${{ steps.legs.outputs.ffi }}
      example-legs: ${{ steps.legs.outputs.example }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The test merge commit's first parent is the base branch head,
            # so this diff is exactly what the pull request changes.
            base=HEAD^1
            everything=false
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base=$BEFORE
            everything=true
          else
            echo "No base to compare with: running everything."
            base=
            everything=true
          fi
          if [ -n "$base" ]; then
            git diff --name-only "$base" HEAD
          fi
          # changed PATHSPEC...: prints true when the change touches any of them.
          changed() {
            if [ -n "$base" ] && git diff --quiet "$base" HEAD -- "$@"; then
              echo false
            else
              echo true
            fi
          }
          not_docs=(. ':(exclude,glob)*.md' ':(exclude)docs' ':(exclude)rfc' ':(exclude)assets')
          generated_doc=$(changed docs/api/providers.md)
          code=$(changed "${not_docs[@]}")
          shared=$(changed "${not_docs[@]}" ':(exclude)bindings' ':(exclude)aimux-ffi')
          # Line-ending rules apply to files of every job, wherever the
          # .gitattributes lives.
          if [ "$generated_doc" = true ] \
              || [ "$(changed ':(glob)**/.gitattributes')" = true ]; then
            code=true
            shared=true
          fi
          if [ "$everything" = true ]; then
            shared=$code
          fi
          platforms=$everything
          if [ "$(changed .github rust-toolchain.toml .cargo aimux-ffi bindings/node \
                bindings/go bindings/flutter bindings/swift \
                scripts/build-ios-xcframework.sh ':(glob)**/.gitattributes' \
                ':(glob)**/Cargo.toml' ':(glob)**/build.rs')" = true ]; then
            platforms=true
          fi
          # job NAME DIRECTORY...: the job runs when shared code changed, or
          # any of the directories it builds and tests.
          job() {
            local name=$1 run=$shared
            shift
            if [ "$(changed "$@")" = true ]; then
              run=true
            fi
            printf '"%s": %s,' "$name" "$run"
          }
          run="{
            $(job rust-test aimux-ffi)
            $(job node-binding bindings/node)
            $(job python-binding bindings/python)
            $(job ffi-build aimux-ffi bindings/go)
            $(job jvm-bindings aimux-ffi bindings/java bindings/kotlin)
            $(job flutter-binding aimux-ffi bindings/flutter)
            $(job flutter-example-build aimux-ffi bindings/flutter)
            $(job swift-contract-tests aimux-ffi bindings/swift)
            \"contract-tests\": $code}"
          run=$(jq -c . <<< "$run")
          printf 'code=%s\nshared=%s\nplatforms=%s\nrun=%s\n' \
            "$code" "$shared" "$platforms" "$run" \
            | tee -a "$GITHUB_OUTPUT"
      # The matrices of the jobs that have macOS or Windows legs. A leg on
      # another host than ubuntu-latest runs only when "platforms" is true,
      # except the Windows x64 Node test leg, which also runs whenever the
      # shared Rust code changed: it is the only job that runs that code on
      # Windows, where I/O errors and refused connections behave differently
      # (Swift tests cover macOS).
      - id: legs
        env:
          PLATFORMS: ${{ steps.diff.outputs.platforms }}
          SHARED: ${{ steps.diff.outputs.shared }}
        run: |
          legs() {
            jq -c --arg platforms "$PLATFORMS" --arg shared "$SHARED" \
              'map(select(.host == "ubuntu-latest" or $platforms == "true"
                or (.shared == true and $shared == "true")) | del(.shared))'
          }
          # darwin-x64 is cross-built on Apple Silicon and tested with x64 Node
          # under Rosetta: Intel macOS runners are slower and scarcer.
          node=$(legs <<'EOF'
          [
            {"host": "windows-latest", "target": "x86_64-pc-windows-msvc", "binary": "aimux.win32-x64-msvc.node", "test": true, "shared": true},
            {"host": "windows-latest", "target": "aarch64-pc-windows-msvc", "binary": "aimux.win32-arm64-msvc.node", "test": false},
            {"host": "macos-latest", "target": "x86_64-apple-darwin", "binary": "aimux.darwin-x64.node", "test": true, "node-arch": "x64"},
            {"host": "macos-latest", "target": "aarch64-apple-darwin", "binary": "aimux.darwin-arm64.node", "test": true},
            {"host": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "binary": "aimux.linux-x64-gnu.node", "test": true},
            {"host": "ubuntu-latest", "target": "aarch64-unknown-linux-gnu", "binary": "aimux.linux-arm64-gnu.node", "test": false}
          ]
          EOF
          )
          ffi=$(legs <<'EOF'
          [
            {"host": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu", "artifact": "libaimux_ffi.so"},
            {"host": "macos-latest", "target": "aarch64-apple-darwin", "artifact": "libaimux_ffi.dylib"},
            {"host": "windows-latest", "target": "x86_64-pc-windows-msvc", "artifact": "aimux_ffi.dll"}
          ]
          EOF
          )
          example=$(legs <<'EOF'
          [
            {"platform": "ios", "host": "macos-latest", "targets": "aarch64-apple-ios aarch64-apple-ios-sim"},
            {"platform": "android", "host": "ubuntu-latest", "targets": "aarch64-linux-android armv7-linux-androideabi x86_64-linux-android"}
          ]
          EOF
          )
          printf 'node=%s\nffi=%s\nexample=%s\n' "$node" "$ffi" "$example" \
            | tee -a "$GITHUB_OUTPUT"

  # ── Rust core: fmt + clippy + tests (single OS — cassettes are platform-agnostic) ──
  rust-test:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['rust-test']
    env:
      # No debug info for the workspace's test binaries: linking them is most
      # of this job. Only this job: node-binding uploads a dev-profile build.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test workspace
        run: cargo test --workspace

  # ── Node binding: build all desktop targets, test on native hosts ───────────
  node-binding:
    name: Node binding (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['node-binding']
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    strategy:
      fail-fast: false
      matrix:
        settings: ${{ fromJSON(needs.changes.outputs.node-legs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # The binding is its own Cargo workspace and builds into its own
          # target directory, not the repository's.
          workspaces: bindings/node -> target
          key: ${{ matrix.settings.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Rosetta
        if: matrix.settings.node-arch == 'x64' && runner.arch == 'ARM64'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.settings.node-arch }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build Linux (glibc 2.17 baseline)
        if: contains(matrix.settings.target, 'unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        env:
          TARGET_CC: clang
          TARGET_CXX: clang++
        run: npx napi build --platform --target ${{ matrix.settings.target }} --use-napi-cross
      - name: Build
        if: ${{ !contains(matrix.settings.target, 'unknown-linux-gnu') }}
        working-directory: bindings/node
        shell: bash
        run: npx napi build --platform --target ${{ matrix.settings.target }}
      - name: Verify artifact
        working-directory: bindings/node
        shell: bash
        run: test -f '${{ matrix.settings.binary }}'
      - name: Verify glibc baseline
        if: contains(matrix.settings.target, 'unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        run: |
          highest=$(readelf --version-info '${{ matrix.settings.binary }}' | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          test -n "$highest"
          test "$(printf '%s\n' GLIBC_2.17 "$highest" | sort -V | tail -1)" = GLIBC_2.17
      - name: Verify static Windows CRT
        if: contains(matrix.settings.target, 'windows-msvc')
        working-directory: bindings/node
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ tools not found' }
          $toolsVersion = (Get-Content "$install\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $targetArch = if ('${{ matrix.settings.target }}' -like 'aarch64-*') { 'arm64' } else { 'x64' }
          $dumpbin = "$install\VC\Tools\MSVC\$toolsVersion\bin\Hostx64\$targetArch\dumpbin.exe"
          $dependencies = & $dumpbin /DEPENDENTS '${{ matrix.settings.binary }}' | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          if ($dependencies -match '(?im)^\s*(?:VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt)[^\s]*\.dll\s*$') {
            throw "Dynamic MSVC runtime dependency found:`n$dependencies"
          }
      # The binding crate's own Rust unit tests (JSON parsing, no Node
      # runtime). The crate is not a member of the main workspace, so
      # rust-test does not run them; one leg suffices.
      - name: Rust unit tests
        if: matrix.settings.test && runner.os == 'Linux'
        run: cargo test --lib --manifest-path bindings/node/Cargo.toml
      - name: Test
        if: matrix.settings.test
        working-directory: bindings/node
        run: npm test
      - name: Typecheck typed wrapper (tsc)
        if: matrix.settings.test
        working-directory: bindings/node
        run: npm run build:typed
      # index.js / index.d.ts are tracked (they ship to npm) but produced by the
      # napi build above — fail if the committed copies have drifted from it.
      # One leg suffices (both files are platform-independent); the Linux test
      # leg avoids CRLF noise from Windows checkouts.
      - name: Verify committed index.js / index.d.ts match napi output
        if: matrix.settings.test && runner.os == 'Linux'
        working-directory: bindings/node
        run: git diff --exit-code -- index.js index.d.ts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.settings.target }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts

  # ── Python binding: build + test (single OS — wheels built per-OS at release) ──
  python-binding:
    name: Python binding
    runs-on: ubuntu-latest
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['python-binding']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - name: Install maturin
        run: pip install "maturin[patchelf]"
      # The binding crate's own Rust unit tests (JSON parsing); the crate is
      # not a member of the main workspace, so rust-test does not run them.
      - name: Rust unit tests
        run: cargo test --lib --manifest-path bindings/python/Cargo.toml
      - name: Build
        working-directory: bindings/python
        shell: bash
        run: |
          maturin build --release
          pip install --force-reinstall target/wheels/*.whl
      - name: Test
        working-directory: bindings/python
        run: |
          pip install pytest pydantic
          python -m pytest tests/ -v

  # ── aimux-ffi: build C ABI library (desktop matrix — source for C/C++ artifacts), test Go on it ──
  ffi-build:
    name: aimux-ffi (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['ffi-build']
    env:
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.ffi-legs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build cdylib
        run: cargo build -p aimux-ffi --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            aimux-ffi/aimux-ffi.h
      # The Go binding links against the library this build produced. On
      # Linux the cgo LDFLAGS force the static archive; on macOS ld64 picks
      # the .dylib next to it (see bindings/go/aimux.go). macOS is covered
      # because those LDFLAGS are platform-specific.
      - uses: actions/setup-go@v5
        if: runner.os != 'Windows'
        with:
          go-version: "1.24.x"
      - name: Vet + test Go binding
        if: runner.os != 'Windows'
        working-directory: bindings/go
        shell: bash
        run: |
          export CGO_LDFLAGS="-L${{ github.workspace }}/target/${{ matrix.target }}/release"
          go vet ./...
          go test ./...
      - name: Race test Go binding
        if: runner.os == 'Linux'
        working-directory: bindings/go
        shell: bash
        run: |
          export CGO_LDFLAGS="-L${{ github.workspace }}/target/${{ matrix.target }}/release"
          go test -race ./...

  # ── Java + Kotlin bindings: one FFI build, every JDK in turn ─────────────
  # Gradle 8.14.3 runs on JDK 8+; the Java build script only sets --release on
  # JDK 9+, so JDK 8 compiles with plain source/target compatibility. The
  # Kotlin build.gradle.kts points jna.library.path at target/release.
  jvm-bindings:
    name: Java + Kotlin bindings
    runs-on: ubuntu-latest
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['jvm-bindings']
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ffi-test"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build FFI library
        run: cargo rustc -p aimux-ffi --release --crate-type cdylib
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21
      - name: Java tests (JDK 8)
        working-directory: bindings/java
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: gradle test --rerun-tasks
      - name: Java tests (JDK 11)
        working-directory: bindings/java
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: gradle test --rerun-tasks
      - name: Java tests (JDK 17)
        working-directory: bindings/java
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle test --rerun-tasks
      - name: Java tests (JDK 21)
        working-directory: bindings/java
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: gradle test --rerun-tasks
      # The Kotlin binding is published to Maven Central by release.yml.
      - name: Kotlin tests (JDK 17)
        working-directory: bindings/kotlin
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle test --rerun-tasks
      - name: Kotlin tests (JDK 21)
        working-directory: bindings/kotlin
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: gradle test --rerun-tasks

  # ── Flutter binding: plugin structure + Dart tests (host FFI lib) ─────────
  flutter-binding:
    name: Flutter binding
    runs-on: ubuntu-latest
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['flutter-binding']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ffi-test"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The Flutter SDK cache is 1.5-2.2 GB per OS and a pull request can only
      # restore caches saved on its own branch or on master, so the action's
      # own cache (which restores and saves together) stays off: restore it on
      # every run, save it from master only, at the end of the job so the
      # engine artifacts the build downloads are in it.
      - uses: subosito/flutter-action@v2
        id: flutter-key
        with:
          channel: stable
          cache: false
          dry-run: true
      - uses: actions/cache/restore@v4
        id: flutter-cache
        with:
          path: ${{ steps.flutter-key.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-key.outputs.CACHE-KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.flutter-key.outputs.CHANNEL }}
          flutter-version: ${{ steps.flutter-key.outputs.VERSION }}
          cache: false
      - name: Build host FFI library
        run: cargo rustc -p aimux-ffi --release --crate-type cdylib
      - name: Get dependencies
        working-directory: bindings/flutter
        run: flutter pub get
      - name: Test
        working-directory: bindings/flutter
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: flutter test
      - name: Analyze
        working-directory: bindings/flutter
        run: flutter analyze
      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/master' && steps.flutter-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.flutter-key.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-key.outputs.CACHE-KEY }}

  # ── Flutter example: real iOS/Android builds validate plugin integration ──
  # iOS build uses the default SwiftPM integration (Flutter 3.44+) and checks
  # the Rust symbols actually made it into the app binary (-all_load path).
  # Android build verifies the .so files reach the APK per ABI.
  flutter-example-build:
    name: Flutter example (${{ matrix.platform }})
    runs-on: ${{ matrix.host }}
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['flutter-example-build']
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.example-legs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The Flutter SDK cache is 1.5-2.2 GB per OS and a pull request can only
      # restore caches saved on its own branch or on master, so the action's
      # own cache (which restores and saves together) stays off: restore it on
      # every run, save it from master only, at the end of the job so the
      # engine artifacts the build downloads are in it.
      - uses: subosito/flutter-action@v2
        id: flutter-key
        with:
          channel: stable
          cache: false
          dry-run: true
      - uses: actions/cache/restore@v4
        id: flutter-cache
        with:
          path: ${{ steps.flutter-key.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-key.outputs.CACHE-KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.flutter-key.outputs.CHANNEL }}
          flutter-version: ${{ steps.flutter-key.outputs.VERSION }}
          cache: false
      - name: Install cargo-ndk
        if: matrix.platform == 'android'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'
      - name: Build iOS xcframework
        if: matrix.platform == 'ios'
        run: |
          bash scripts/build-ios-xcframework.sh bindings/flutter/ios/aimux_ffi.xcframework
      - name: Build Android .so per ABI
        if: matrix.platform == 'android'
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o bindings/flutter/android/src/main/jniLibs build -p aimux-ffi --release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f bindings/flutter/android/src/main/jniLibs/$abi/libaimux_ffi.so \
              || { echo "Missing $abi" >&2; exit 1; }
          done
      - name: Build example (iOS — CocoaPods; Flutter SPM can't link plugin binaries)
        if: matrix.platform == 'ios'
        working-directory: bindings/flutter/example
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --debug --no-codesign --simulator
          # Debug builds link the app code into Runner.debug.dylib; the
          # Runner stub carries no symbols — scan every executable in the app.
          FOUND=""
          while IFS= read -r f; do
            if nm -g "$f" 2>/dev/null | grep -q 'aimux_openai_new'; then
              echo "FOUND aimux_openai_new in: $f"
              FOUND=yes
            fi
          done < <(find build/ios/iphonesimulator/Runner.app -type f -perm -111 2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo 'OK: aimux symbols present'
          else
            echo 'FAIL: aimux_openai_new missing from all app binaries'
            exit 1
          fi
      - name: Build example (Android)
        if: matrix.platform == 'android'
        working-directory: bindings/flutter/example
        run: |
          flutter build apk --debug
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | \
            grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libaimux_ffi\.so' || \
            { echo '--- APK lib contents ---'; unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/'; exit 1; }
      - name: Example tests
        working-directory: bindings/flutter/example
        run: flutter test
      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/master' && steps.flutter-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.flutter-key.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-key.outputs.CACHE-KEY }}

  # Generated files must match their generators.
  contract-tests:
    name: Generator drift checks
    runs-on: ubuntu-latest
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['contract-tests']
    steps:
      - uses: actions/checkout@v4
      - name: Providers doc generator drift (docs/api/providers.md must match generator output)
        run: python3 scripts/gen_providers_doc.py --check
      - name: Provider boundaries (no call-level reads or provider-name branches in providers, removed names stay removed)
        run: bash scripts/check_provider_boundaries.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: ts-rs export drift (checked-in types must match generator output)
        run: python3 scripts/gen_ts_types.py --check
      # The AI SDK pin tooling: VERSIONS.json format and integrity rules, and
      # fetch-aisdk.sh against a registry served on 127.0.0.1 (no network).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: AI SDK pin scripts (fetch-aisdk.sh, VERSIONS.json helpers)
        run: node --test scripts/fetch-aisdk.test.mjs scripts/aisdk-fixtures/versions.test.mjs

  # Swift tests need macOS (XCTest) and the FFI cdylib, which the Swift package
  # links via the CAimuxFFI system module.
  swift-contract-tests:
    name: Swift tests
    runs-on: macos-latest
    needs: changes
    if: fromJSON(needs.changes.outputs.run)['swift-contract-tests']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the FFI library the Swift package links against
        run: cargo build -p aimux-ffi --release
      - name: Run Swift tests
        working-directory: bindings/swift
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: |
          swift test -Xlinker -L${{ github.workspace }}/target/release

  # The one check to require in branch protection. It runs whatever happened
  # above: a job may be skipped only because "changes" decided it is not
  # needed; any other skip, failure or cancellation fails it. A new job goes
  # into the map in "changes" (a job missing there turns this red) and into
  # the list below (a job missing here is not checked at all).
  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - rust-test
      - node-binding
      - python-binding
      - ffi-build
      - jvm-bindings
      - flutter-binding
      - flutter-example-build
      - contract-tests
      - swift-contract-tests
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          RUN: ${{ needs.changes.outputs.run }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "$NEEDS" | jq -e --argjson run "${RUN:-null}" '
            .changes.result == "success" and
            (del(.changes) | to_entries | all(.value.result == "success"
              or (.value.result == "skipped" and $run[.key] == false)))'
          if [ "$CODE" = false ]; then
            echo "Documentation-only change: build and test jobs not applicable." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
