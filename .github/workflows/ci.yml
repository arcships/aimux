name: CI

on:
  push:
    branches: [master]
  # Every pull request runs the checks, whatever its base: stacked PRs are
  # reviewed against the PR below them.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Node and Python replay the shared vectors from this checkout.
  AIMUX_CONTRACT_VECTORS: ${{ github.workspace }}/contract-tests/ops
  # Test-only jobs do not ship binaries: skip single-threaded fat LTO and -Oz
  # size optimization. ffi-build uploads release artifacts and restores
  # Cargo.toml's release profile in its job env.
  # opt-level 1, not 0: aimux_stream drives the whole stream future on
  # the caller's thread, and at opt-level 0 that needs more than the 512 KB
  # stack of a Swift cooperative thread (SIGBUS in the async Swift tests).
  # Measured for one stream through the C ABI: ~530 KB at 0, ~110 KB at 1,
  # ~160 KB with the shipping profile.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_IOS_RELEASE_OPT_LEVEL: "z"
  CARGO_PROFILE_IOS_RELEASE_CODEGEN_UNITS: "1"

jobs:
  # ── Rust core: fmt + clippy + tests (single OS — cassettes are platform-agnostic) ──
  rust-test:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    env:
      # No debug info for the workspace's test binaries: linking them is most
      # of this job. Only this job: node-binding uploads a dev-profile build.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Ops contract tests (matrix, lifecycle, streams, envelopes, manifest)
        run: cargo test -p aimux-ops
      - name: Test workspace
        run: cargo test --workspace

  # ── Node binding: build all desktop targets, test on native hosts ───────────
  node-binding:
    name: Node binding (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            binary: aimux.win32-x64-msvc.node
            test: true
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            binary: aimux.win32-arm64-msvc.node
            test: false
          # Cross-built on Apple Silicon and tested with x64 Node under
          # Rosetta: Intel macOS runners are slower and scarcer.
          - host: macos-latest
            target: x86_64-apple-darwin
            binary: aimux.darwin-x64.node
            test: true
            node-arch: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            binary: aimux.darwin-arm64.node
            test: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: aimux.linux-x64-gnu.node
            test: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: aimux.linux-arm64-gnu.node
            test: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # The binding is its own Cargo workspace and builds into its own
          # target directory, not the repository's.
          workspaces: bindings/node -> target
          key: ${{ matrix.settings.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install Rosetta
        if: matrix.settings.node-arch == 'x64' && runner.arch == 'ARM64'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.settings.node-arch }}
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build Linux (glibc 2.17 baseline)
        if: contains(matrix.settings.target, 'unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        env:
          TARGET_CC: clang
          TARGET_CXX: clang++
        run: npx napi build --platform --target ${{ matrix.settings.target }} --use-napi-cross
      - name: Build
        if: ${{ !contains(matrix.settings.target, 'unknown-linux-gnu') }}
        working-directory: bindings/node
        shell: bash
        run: npx napi build --platform --target ${{ matrix.settings.target }}
      - name: Verify artifact
        working-directory: bindings/node
        shell: bash
        run: test -f '${{ matrix.settings.binary }}'
      - name: Verify glibc baseline
        if: contains(matrix.settings.target, 'unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        run: |
          highest=$(readelf --version-info '${{ matrix.settings.binary }}' | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          test -n "$highest"
          test "$(printf '%s\n' GLIBC_2.17 "$highest" | sort -V | tail -1)" = GLIBC_2.17
      - name: Verify static Windows CRT
        if: contains(matrix.settings.target, 'windows-msvc')
        working-directory: bindings/node
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ tools not found' }
          $toolsVersion = (Get-Content "$install\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $targetArch = if ('${{ matrix.settings.target }}' -like 'aarch64-*') { 'arm64' } else { 'x64' }
          $dumpbin = "$install\VC\Tools\MSVC\$toolsVersion\bin\Hostx64\$targetArch\dumpbin.exe"
          $dependencies = & $dumpbin /DEPENDENTS '${{ matrix.settings.binary }}' | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          if ($dependencies -match '(?im)^\s*(?:VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt)[^\s]*\.dll\s*$') {
            throw "Dynamic MSVC runtime dependency found:`n$dependencies"
          }
      - name: Test Node binding and shared contract vectors
        if: matrix.settings.test
        working-directory: bindings/node
        run: npm test
      - name: Typecheck typed wrapper (tsc)
        if: matrix.settings.test
        working-directory: bindings/node
        run: npm run build:typed
      - name: DTO vector codecs
        if: matrix.settings.test && runner.os == 'Linux'
        run: python3 scripts/check_dto_vectors.py node
      # index.js / index.d.ts are tracked (they ship to npm) but produced by the
      # napi build above — fail if the committed copies have drifted from it.
      # One leg suffices (both files are platform-independent); the Linux test
      # leg avoids CRLF noise from Windows checkouts.
      - name: Verify committed index.js / index.d.ts match napi output
        if: matrix.settings.test && runner.os == 'Linux'
        working-directory: bindings/node
        run: git diff --exit-code -- index.js index.d.ts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.settings.target }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts

  # ── Python binding: build + test (single OS — wheels built per-OS at release) ──
  python-binding:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - name: Install maturin
        run: pip install "maturin[patchelf]"
      - name: Build
        working-directory: bindings/python
        shell: bash
        run: |
          maturin build --release
          pip install --force-reinstall target/wheels/*.whl
      - name: Test Python binding and shared contract vectors
        working-directory: bindings/python
        run: |
          pip install pytest pydantic
          python -m pytest tests/ -v
      - name: DTO vector codecs
        run: python3 scripts/check_dto_vectors.py python

  # ── aimux-ffi: build C ABI library (desktop matrix — source for C/C++ artifacts), test Go on it ──
  ffi-build:
    name: aimux-ffi (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    env:
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "z"
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libaimux_ffi.so
          - host: macos-latest
            target: aarch64-apple-darwin
            artifact: libaimux_ffi.dylib
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aimux_ffi.dll
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build cdylib
        run: cargo build -p aimux-ffi --release --target ${{ matrix.target }}
      - name: C11 and C++17 ABI contract tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          AIMUX_C_LIB_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: bash scripts/test-c-abi.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            aimux-ffi/include/aimux.h
      # The Go binding links against the library this build produced. On
      # Linux the cgo LDFLAGS force the static archive; on macOS ld64 picks
      # the .dylib next to it (see bindings/go/aimux.go). macOS is covered
      # because those LDFLAGS are platform-specific.
      - uses: actions/setup-go@v5
        if: runner.os != 'Windows'
        with:
          go-version: "1.24.x"
      - name: Vet + test Go binding
        if: runner.os != 'Windows'
        working-directory: bindings/go
        shell: bash
        run: |
          export CGO_LDFLAGS="-L${{ github.workspace }}/target/${{ matrix.target }}/release"
          go vet ./...
          go test ./...
      - name: Race test Go binding
        if: runner.os == 'Linux'
        working-directory: bindings/go
        shell: bash
        run: |
          export CGO_LDFLAGS="-L${{ github.workspace }}/target/${{ matrix.target }}/release"
          go test -race ./...
      - name: DTO vector codecs
        if: runner.os == 'Linux'
        run: python3 scripts/check_dto_vectors.py go

  ffi-sanitizers:
    name: C ABI (ASan + LSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ffi-test"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build FFI library
        run: cargo rustc -p aimux-ffi --release --crate-type cdylib
      - name: Run C11 and C++17 ABI tests with ASan and LSan
        env:
          CC: clang
          CXX: clang++
          AIMUX_C_LIB_DIR: ${{ github.workspace }}/target/release
        run: bash scripts/test-c-abi.sh --asan-lsan

  ffi-linux-arm:
    name: aimux-ffi (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build Linux ARM64 FFI library
        run: cargo build -p aimux-ffi --release --target aarch64-unknown-linux-gnu

  # ── Java + Kotlin bindings: one FFI build, every JDK in turn ─────────────
  # Gradle 8.14.3 runs on JDK 8+; the Java build script only sets --release on
  # JDK 9+, so JDK 8 compiles with plain source/target compatibility. The
  # Kotlin build.gradle.kts points jna.library.path at target/release.
  jvm-bindings:
    name: Java + Kotlin bindings
    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ffi-test"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build FFI library
        run: cargo rustc -p aimux-ffi --release --crate-type cdylib
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21
      - name: Java tests (JDK 8)
        working-directory: bindings/java
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_8_X64 }}
        run: gradle test --rerun-tasks
      - name: Java tests (JDK 11)
        working-directory: bindings/java
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: gradle test --rerun-tasks
      - name: Java tests (JDK 17)
        working-directory: bindings/java
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle test --rerun-tasks
      - name: Java tests (JDK 21)
        working-directory: bindings/java
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: gradle test --rerun-tasks
      - name: DTO vector codecs
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: python3 scripts/check_dto_vectors.py java
      # The Kotlin binding is published to Maven Central by release.yml.
      - name: Kotlin tests (JDK 17)
        working-directory: bindings/kotlin
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: gradle test --rerun-tasks
      - name: Kotlin tests (JDK 21)
        working-directory: bindings/kotlin
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: gradle test --rerun-tasks

  # ── Flutter binding: plugin structure + Dart tests (host FFI lib) ─────────
  flutter-binding:
    name: Flutter binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ffi-test"
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The Flutter SDK cache is 1.5-2.2 GB per OS and a pull request can only
      # restore caches saved on its own branch or on master, so the action's
      # own cache (which restores and saves together) stays off: restore it on
      # every run, save it from master only, at the end of the job so the
      # engine artifacts the build downloads are in it.
      - uses: subosito/flutter-action@v2
        id: flutter-key
        with:
          channel: stable
          cache: false
          dry-run: true
      - uses: actions/cache/restore@v4
        id: flutter-cache
        with:
          path: ${{ steps.flutter-key.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-key.outputs.CACHE-KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.flutter-key.outputs.CHANNEL }}
          flutter-version: ${{ steps.flutter-key.outputs.VERSION }}
          cache: false
      - name: Build host FFI library
        run: cargo rustc -p aimux-ffi --release --crate-type cdylib
      - name: Get dependencies
        working-directory: bindings/flutter
        run: flutter pub get
      - name: Build the ABI test fixtures and the Dart bridge
        working-directory: bindings/flutter
        run: |
          python3 tool/build_test_fixture.py
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared -pthread native/aimux_dart.c \
            -o .dart_tool/native/libaimux_dart.so
      - name: Test Flutter binding
        working-directory: bindings/flutter
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          AIMUX_NATIVE_LIBRARY: ${{ github.workspace }}/target/release/libaimux_ffi.so
          AIMUX_DART_BRIDGE: ${{ github.workspace }}/bindings/flutter/.dart_tool/native/libaimux_dart.so
        run: flutter test
      - name: Analyze
        working-directory: bindings/flutter
        run: flutter analyze
      - name: DTO vector codecs
        run: python3 scripts/check_dto_vectors.py dart
      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/master' && steps.flutter-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.flutter-key.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-key.outputs.CACHE-KEY }}

  # ── Flutter example: real iOS/Android builds validate plugin integration ──
  # iOS build uses the default SwiftPM integration (Flutter 3.44+) and checks
  # the Rust symbols actually made it into the app binary (-all_load path).
  # Android build verifies the .so files reach the APK per ABI.
  flutter-example-build:
    name: Flutter example (${{ matrix.platform }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            host: macos-latest
            targets: aarch64-apple-ios aarch64-apple-ios-sim
          - platform: android
            host: ubuntu-latest
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The Flutter SDK cache is 1.5-2.2 GB per OS and a pull request can only
      # restore caches saved on its own branch or on master, so the action's
      # own cache (which restores and saves together) stays off: restore it on
      # every run, save it from master only, at the end of the job so the
      # engine artifacts the build downloads are in it.
      - uses: subosito/flutter-action@v2
        id: flutter-key
        with:
          channel: stable
          cache: false
          dry-run: true
      - uses: actions/cache/restore@v4
        id: flutter-cache
        with:
          path: ${{ steps.flutter-key.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-key.outputs.CACHE-KEY }}
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ steps.flutter-key.outputs.CHANNEL }}
          flutter-version: ${{ steps.flutter-key.outputs.VERSION }}
          cache: false
      - name: Install cargo-ndk
        if: matrix.platform == 'android'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'
      - name: Build iOS xcframework
        if: matrix.platform == 'ios'
        run: |
          bash scripts/build-ios-xcframework.sh bindings/flutter/ios/aimux_ffi.xcframework
      - name: Build Android .so per ABI
        if: matrix.platform == 'android'
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o bindings/flutter/android/src/main/jniLibs build -p aimux-ffi --release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f bindings/flutter/android/src/main/jniLibs/$abi/libaimux_ffi.so \
              || { echo "Missing $abi" >&2; exit 1; }
          done
      - name: Build example (iOS — CocoaPods; Flutter SPM can't link plugin binaries)
        if: matrix.platform == 'ios'
        working-directory: bindings/flutter/example
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --debug --no-codesign --simulator
          bash ../tool/check_symbols.sh build/ios/iphonesimulator/Runner.app
      - name: Build example (Android)
        if: matrix.platform == 'android'
        working-directory: bindings/flutter/example
        run: |
          flutter build apk --debug
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | \
            grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libaimux_ffi\.so' || \
            { echo '--- APK lib contents ---'; unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/'; exit 1; }
      - name: Example tests
        working-directory: bindings/flutter/example
        run: flutter test
      - uses: actions/cache/save@v4
        if: always() && github.ref == 'refs/heads/master' && steps.flutter-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.flutter-key.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-key.outputs.CACHE-KEY }}

  # Generated files must match their generators.
  contract-tests:
    name: Generator drift checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Providers doc generator drift (docs/api/providers.md must match generator output)
        run: python3 scripts/gen_providers_doc.py --check
      - name: Provider boundaries (no call-level reads or provider-name branches in providers, removed names stay removed)
        run: bash scripts/check_provider_boundaries.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ops manifest and generated artifact drift
        run: cargo run -p aimux-codegen -- --check

  # Swift tests need macOS (XCTest) and the FFI cdylib, which the Swift package
  # links via the CAimuxFFI system module.
  swift-contract-tests:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the FFI library the Swift package links against
        run: cargo build -p aimux-ffi --release
      - name: Run Swift tests
        working-directory: bindings/swift
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: |
          swift test -Xlinker -L${{ github.workspace }}/target/release
      - name: DTO vector codecs
        run: python3 scripts/check_dto_vectors.py swift
