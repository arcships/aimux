name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust core: fmt + clippy + tests (single OS — cassettes are platform-agnostic) ──
  rust-test:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc (deny warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Test workspace
        run: cargo test --workspace

  # ── Node binding: build all desktop targets, test on native hosts ───────────
  node-binding:
    name: Node binding (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.13'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            binary: aimux.win32-x64-msvc.node
            test: true
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            binary: aimux.win32-arm64-msvc.node
            test: false
          - host: macos-15-intel
            target: x86_64-apple-darwin
            binary: aimux.darwin-x64.node
            test: true
          - host: macos-latest
            target: aarch64-apple-darwin
            binary: aimux.darwin-arm64.node
            test: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: aimux.linux-x64-gnu.node
            test: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: aimux.linux-arm64-gnu.node
            test: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci
      - name: Build Linux (glibc 2.17 baseline)
        if: contains(matrix.settings.target, 'unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        env:
          TARGET_CC: clang
          TARGET_CXX: clang++
        run: npx napi build --platform --target ${{ matrix.settings.target }} --use-napi-cross
      - name: Build
        if: ${{ !contains(matrix.settings.target, 'unknown-linux-gnu') }}
        working-directory: bindings/node
        shell: bash
        run: npx napi build --platform --target ${{ matrix.settings.target }}
      - name: Verify artifact
        working-directory: bindings/node
        shell: bash
        run: test -f '${{ matrix.settings.binary }}'
      - name: Verify glibc baseline
        if: contains(matrix.settings.target, 'unknown-linux-gnu')
        working-directory: bindings/node
        shell: bash
        run: |
          highest=$(readelf --version-info '${{ matrix.settings.binary }}' | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          test -n "$highest"
          test "$(printf '%s\n' GLIBC_2.17 "$highest" | sort -V | tail -1)" = GLIBC_2.17
      - name: Verify static Windows CRT
        if: contains(matrix.settings.target, 'windows-msvc')
        working-directory: bindings/node
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw 'Visual Studio C++ tools not found' }
          $toolsVersion = (Get-Content "$install\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $targetArch = if ('${{ matrix.settings.target }}' -like 'aarch64-*') { 'arm64' } else { 'x64' }
          $dumpbin = "$install\VC\Tools\MSVC\$toolsVersion\bin\Hostx64\$targetArch\dumpbin.exe"
          $dependencies = & $dumpbin /DEPENDENTS '${{ matrix.settings.binary }}' | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          if ($dependencies -match '(?im)^\s*(?:VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt)[^\s]*\.dll\s*$') {
            throw "Dynamic MSVC runtime dependency found:`n$dependencies"
          }
      - name: Test
        if: matrix.settings.test
        working-directory: bindings/node
        run: npm test
      - name: Typecheck typed wrapper (tsc)
        if: matrix.settings.test
        working-directory: bindings/node
        run: npm run build:typed
      # index.js / index.d.ts are tracked (they ship to npm) but produced by the
      # napi build above — fail if the committed copies have drifted from it.
      # One leg suffices (both files are platform-independent); the Linux test
      # leg avoids CRLF noise from Windows checkouts.
      - name: Verify committed index.js / index.d.ts match napi output
        if: matrix.settings.test && runner.os == 'Linux'
        working-directory: bindings/node
        run: git diff --exit-code -- index.js index.d.ts
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.settings.target }}
          path: |
            bindings/node/*.node
            bindings/node/index.js
            bindings/node/index.d.ts

  # ── Python binding: build + test (single OS — wheels built per-OS at release) ──
  python-binding:
    name: Python binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin[patchelf]"
      - name: Build
        working-directory: bindings/python
        shell: bash
        run: |
          maturin build --release
          pip install --force-reinstall target/wheels/*.whl
      - name: Test
        working-directory: bindings/python
        run: |
          pip install pytest pydantic
          python -m pytest tests/ -v

  # ── aimux-ffi: build C ABI library (desktop matrix — source for C/C++ artifacts) ──
  ffi-build:
    name: aimux-ffi (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libaimux_ffi.so
          - host: macos-latest
            target: aarch64-apple-darwin
            artifact: libaimux_ffi.dylib
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: aimux_ffi.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build cdylib
        run: cargo build -p aimux-ffi --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            aimux-ffi/aimux-ffi.h

  # ── Java binding: build FFI lib + test across JDK versions ─────────────────
  # Gradle 8.14.3 runs on JDK 8+; the build script only sets --release on JDK 9+,
  # so the Java 8 matrix entry compiles with plain source/target compatibility.
  java-binding:
    name: Java binding (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build FFI library
        run: cargo build -p aimux-ffi --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Test
        working-directory: bindings/java
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: gradle test

  # ── Kotlin binding: same gradle setup as Java ─────────────────────────────
  # The Kotlin binding is published to Maven Central by release.yml but had no
  # job here, so nothing ever compiled or ran its six test files. Its
  # build.gradle.kts already points jna.library.path at target/release.
  kotlin-binding:
    name: Kotlin binding (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build FFI library
        run: cargo build -p aimux-ffi --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Test
        working-directory: bindings/kotlin
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: gradle test

  # ── Go binding: build FFI static archive + vet/test ───────────────────────
  go-binding:
    name: Go binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS included because the cgo LDFLAGS are platform-specific
        # (ld64 rejects GNU -Bstatic/-Bdynamic; see bindings/go/aimux.go).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build static archive
        run: cargo build -p aimux-ffi --release
      - name: Vet + test Go binding
        working-directory: bindings/go
        shell: bash
        run: |
          export CGO_LDFLAGS="-L${{ github.workspace }}/target/release"
          go vet ./...
          go test ./...
      - name: Race test Go binding
        if: runner.os == 'Linux'
        working-directory: bindings/go
        shell: bash
        run: |
          export CGO_LDFLAGS="-L${{ github.workspace }}/target/release"
          go test -race ./...

  # ── Flutter binding: plugin structure + Dart tests (host FFI lib) ─────────
  flutter-binding:
    name: Flutter binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build host FFI library
        run: cargo build -p aimux-ffi --release
      - name: Get dependencies
        working-directory: bindings/flutter
        run: flutter pub get
      - name: Test
        working-directory: bindings/flutter
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: flutter test
      - name: Analyze
        working-directory: bindings/flutter
        run: flutter analyze

  # ── Flutter example: real iOS/Android builds validate plugin integration ──
  # iOS build uses the default SwiftPM integration (Flutter 3.44+) and checks
  # the Rust symbols actually made it into the app binary (-all_load path).
  # Android build verifies the .so files reach the APK per ABI.
  flutter-example-build:
    name: Flutter example (${{ matrix.platform }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            host: macos-latest
            targets: aarch64-apple-ios aarch64-apple-ios-sim
          - platform: android
            host: ubuntu-latest
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build iOS xcframework
        if: matrix.platform == 'ios'
        run: |
          bash scripts/build-ios-xcframework.sh bindings/flutter/ios/aimux_ffi.xcframework
      - name: Build Android .so per ABI
        if: matrix.platform == 'android'
        run: |
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o bindings/flutter/android/src/main/jniLibs build -p aimux-ffi --release
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f bindings/flutter/android/src/main/jniLibs/$abi/libaimux_ffi.so \
              || { echo "Missing $abi" >&2; exit 1; }
          done
      - name: Build example (iOS — CocoaPods; Flutter SPM can't link plugin binaries)
        if: matrix.platform == 'ios'
        working-directory: bindings/flutter/example
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --debug --no-codesign --simulator
          # Debug builds link the app code into Runner.debug.dylib; the
          # Runner stub carries no symbols — scan every executable in the app.
          FOUND=""
          while IFS= read -r f; do
            if nm -g "$f" 2>/dev/null | grep -q 'aimux_openai_new'; then
              echo "FOUND aimux_openai_new in: $f"
              FOUND=yes
            fi
          done < <(find build/ios/iphonesimulator/Runner.app -type f -perm -111 2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo 'OK: aimux symbols present'
          else
            echo 'FAIL: aimux_openai_new missing from all app binaries'
            exit 1
          fi
      - name: Build example (Android)
        if: matrix.platform == 'android'
        working-directory: bindings/flutter/example
        run: |
          flutter build apk --debug
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | \
            grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libaimux_ffi\.so' || \
            { echo '--- APK lib contents ---'; unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep 'lib/'; exit 1; }
      - name: Example tests
        working-directory: bindings/flutter/example
        run: flutter test

  # ── Contract tests: shared JSON fixtures (catches cross-language type drift) ──
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ProviderName generator drift (checked-in files must match generator output)
        run: python3 scripts/gen_provider_names.py --check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Rust contract tests
        run: cargo test --test contract_test -p aimux-core
      - name: ts-rs export drift (checked-in types must match generator output)
        run: python3 scripts/gen_ts_types.py --check
      - name: Build Node binding
        working-directory: bindings/node
        run: |
          npm ci
          npx napi build --platform
      - name: Run Node contract tests
        working-directory: contract-tests
        run: |
          node --experimental-strip-types run-node.ts

  # ── Swift contract tests: the eighth binding joins the shared fixtures ─────
  # Needs macOS (XCTest) and the FFI cdylib, which the Swift package links via
  # the CAimuxFFI system module. The Dart side needs no job here: flutter-binding
  # already runs `flutter test`, which picks up bindings/flutter/test/contract_test.dart.
  swift-contract-tests:
    name: Swift contract tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the FFI library the Swift package links against
        run: cargo build -p aimux-ffi --release
      - name: Run Swift contract tests
        working-directory: bindings/swift
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: |
          swift test -Xlinker -L${{ github.workspace }}/target/release
