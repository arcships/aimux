# Upstream file map for aimux-providers (RFC-0046 §4.4, RFC-0045 §3).
# One table per vendor with an upstream package; versions come from
# fixtures/aisdk/VERSIONS.json. `rust` paths are relative to src/.

[google]
package = "@ai-sdk/google"
# google-language-model.test.ts has two cases named `doGenerate › should pass tools and
# toolChoice`; the second marker ends in `#2` (RFC-0045 §4).

[[google.files]]
upstream = "src/convert-google-usage.ts"
rust = "google/convert.rs"
status = "mapped"

[google.files.tests]

