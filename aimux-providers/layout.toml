# Upstream file map for aimux-providers (RFC-0046 §4.4, RFC-0045 §3).
# One table per vendor with an upstream package; versions come from
# fixtures/aisdk/VERSIONS.json. `rust` paths are relative to src/.

[huggingface]
package = "@ai-sdk/huggingface"

[[huggingface.files]]
upstream = "src/huggingface-config.ts"
rust = "huggingface/provider.rs"
status = "mapped"

[huggingface.files.tests]

[[huggingface.files]]
upstream = "src/huggingface-error.ts"
rust = "huggingface/error.rs"
status = "mapped"

[huggingface.files.tests]

[[huggingface.files]]
upstream = "src/huggingface-provider.ts"
rust = "huggingface/provider.rs"
status = "mapped"

[huggingface.files.tests]
sub-feature = [
  { case = "HuggingFaceProvider › unsupported functionality › should throw for text embedding models", issue = 276, reason = "aimux-core NoSuchModel carries only model_id and model_type and formats as \"no such model: …\", without the provider's own message" },
  { case = "HuggingFaceProvider › unsupported functionality › should throw for image models", issue = 276, reason = "aimux-core NoSuchModel carries only model_id and model_type and formats as \"no such model: …\", without the provider's own message" },
]

[[huggingface.files]]
upstream = "src/index.ts"
rust = "huggingface/mod.rs"
status = "mapped"

[huggingface.files.tests]

[[huggingface.files]]
upstream = "src/responses/convert-huggingface-responses-usage.ts"
rust = "huggingface/responses/convert_responses_usage.rs"
status = "mapped"

[huggingface.files.tests]

[[huggingface.files]]
upstream = "src/responses/convert-to-huggingface-responses-messages.ts"
rust = "huggingface/responses/convert_to_responses_messages.rs"
status = "mapped"

[huggingface.files.tests]

[[huggingface.files]]
upstream = "src/responses/huggingface-responses-language-model-options.ts"
rust = "huggingface/responses/responses_language_model_options.rs"
status = "mapped"

[huggingface.files.tests]

[[huggingface.files]]
upstream = "src/responses/huggingface-responses-language-model.ts"
rust = "huggingface/responses/responses_language_model.rs"
status = "mapped"

[huggingface.files.tests]
registered = [
  { case = "HuggingFaceResponsesLanguageModel › doStream › preserves $expectedType stream errors", ref = "SSE 预读", reason = "an error as the first SSE event is returned by do_stream as Err, not as an error part of the stream" },
]
sub-feature = [
  { case = "HuggingFaceResponsesLanguageModel › message conversion › should throw for file parts with provider references", issue = 276, reason = "aimux-core formats UnsupportedFunctionalityError as \"unsupported functionality: …\", not upstream's \"'…' functionality not supported.\"" },
]

[[huggingface.files]]
upstream = "src/responses/huggingface-responses-prepare-tools.ts"
rust = "huggingface/responses/responses_prepare_tools.rs"
status = "mapped"

[huggingface.files.tests]

[[huggingface.files]]
upstream = "src/responses/map-huggingface-responses-finish-reason.ts"
rust = "huggingface/responses/map_responses_finish_reason.rs"
status = "mapped"

[huggingface.files.tests]

[[huggingface.files]]
upstream = "src/responses/huggingface-responses-settings.ts"
status = "not-applicable"
reason = "only the HuggingFaceResponsesModelId string union; Rust takes the model id as &str"

[[huggingface.files]]
upstream = "src/version.ts"
status = "not-applicable"
reason = "the crate version is used instead (RFC-0046 §4.2)"
