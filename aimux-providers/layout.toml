[vertex]
package = "@ai-sdk/google-vertex"
# One aimux entry point: the edge entries (edge/, */edge/) and the *-node entries map to
# the same Rust file as the provider they wrap. google-vertex-language-model.test.ts and
# google-vertex-location-validation.test.ts have no source file of their own name; every
# case in them is ported, so they need no exclusions.

[[vertex.files]]
upstream = "src/anthropic/edge/google-vertex-anthropic-provider-edge.ts"
rust = "vertex/anthropic_provider.rs"
status = "mapped"

[vertex.files.tests]

