# Upstream file map for aimux-providers (RFC-0046 §4.4, RFC-0045 §3).
# One table per vendor with an upstream package; versions come from
# fixtures/aisdk/VERSIONS.json. `rust` paths are relative to src/.

[open_responses]
package = "@ai-sdk/open-responses"

[[open_responses.files]]
upstream = "src/index.ts"
rust = "open_responses/mod.rs"
status = "mapped"

[open_responses.files.tests]

[[open_responses.files]]
upstream = "src/open-responses-extension.ts"
status = "missing"
issue = 275

[[open_responses.files]]
upstream = "src/open-responses-provider.ts"
rust = "open_responses/provider.rs"
status = "mapped"

[open_responses.files.tests]
sub-feature = [
  { case = "endpoint-specific response error metadata › maps generation failures without assuming a vendor status field", issue = 275, reason = "OpenResponsesProviderSettings has no getResponseErrorMetadata" },
  { case = "endpoint-specific response error metadata › maps %s stream errors with the same callback", issue = 275, reason = "OpenResponsesProviderSettings has no getResponseErrorMetadata" },
]

