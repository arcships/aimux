[openai.files.tests]
sub-feature = [
  { case = "throwIfOpenAIStreamErrorBeforeOutput › should keep blocking until output when no accepted-chunk detector is provided", issue = 275, reason = "no generic helper with getError / isOutputChunk / isAcceptedChunk callbacks; the Responses do_stream applies the same rule through the crate-private read_until_output, which the doStream cases cover" },
  { case = "throwIfOpenAIStreamErrorBeforeOutput › should resolve on the first output chunk and replay all chunks to the consumer", issue = 275, reason = "no generic helper with getError / isOutputChunk / isAcceptedChunk callbacks; the Responses do_stream applies the same rule through the crate-private read_until_output, which the doStream cases cover" },
  { case = "throwIfOpenAIStreamErrorBeforeOutput › should throw when an error frame arrives before output without cancelling the source", issue = 275, reason = "no generic helper with getError / isOutputChunk / isAcceptedChunk callbacks; the Responses do_stream applies the same rule through the crate-private read_until_output, which the doStream cases cover" },
  { case = "throwIfOpenAIStreamErrorBeforeOutput › with an accepted-chunk detector › should resolve after the grace window when the stream stalls after acceptance", issue = 275, reason = "no generic helper with getError / isOutputChunk / isAcceptedChunk callbacks; the Responses do_stream applies the same rule through the crate-private read_until_output, which the doStream cases cover" },
  { case = "throwIfOpenAIStreamErrorBeforeOutput › with an accepted-chunk detector › should resolve immediately on output without waiting for the grace window", issue = 275, reason = "no generic helper with getError / isOutputChunk / isAcceptedChunk callbacks; the Responses do_stream applies the same rule through the crate-private read_until_output, which the doStream cases cover" },
  { case = "throwIfOpenAIStreamErrorBeforeOutput › with an accepted-chunk detector › should still throw when an error frame is flushed together with the accepted chunk", issue = 275, reason = "no generic helper with getError / isOutputChunk / isAcceptedChunk callbacks; the Responses do_stream applies the same rule through the crate-private read_until_output, which the doStream cases cover" },
  { case = "throwIfOpenAIStreamErrorBeforeOutput › with an accepted-chunk detector › should surface a source error to the consumer after grace resolution without unhandled rejections", issue = 275, reason = "no generic helper with getError / isOutputChunk / isAcceptedChunk callbacks; the Responses do_stream applies the same rule through the crate-private read_until_output, which the doStream cases cover" },
]

