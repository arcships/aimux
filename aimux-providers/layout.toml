  { case = "OpenAI Files - downloadFile › should expose the response content type as mediaType (parameters stripped)", issue = 275, reason = "the Files trait has no download_file" },
  { case = "OpenAI Files - getFileMetadata › should omit expiresAt when the provider reports none", issue = 275, reason = "the Files trait has no get_file_metadata" },
  { case = "OpenAI Files - getFileMetadata › should preserve dot-segment file id $fileId as a URL path segment", issue = 275, reason = "the Files trait has no get_file_metadata" },
  { case = "OpenAI Files - getFileMetadata › should reject a blank openai file id (%j)", issue = 275, reason = "the Files trait has no get_file_metadata" },
  { case = "OpenAI Files - getFileMetadata › should reject a reference without an openai file id", issue = 275, reason = "the Files trait has no get_file_metadata" },
  { case = "OpenAI Files - getFileMetadata › should retrieve file metadata via GET", issue = 275, reason = "the Files trait has no get_file_metadata" },
  { case = "OpenAI Files - uploadFile (pre-request rejection) › should cancel stream data when provider options are invalid", issue = 275, reason = "UploadFileData has no stream variant" },
  { case = "OpenAI Files - uploadFile (result fields) › should expose byteSize/createdAt/expiresAt from the upload response", issue = 275, reason = "UploadFileResult has no byte_size, created_at or expires_at" },
  { case = "OpenAI Files - uploadFile (stream data) › should default the filename to \"blob\" on filename-less stream uploads", issue = 275, reason = "UploadFileData has no stream variant" },
  { case = "OpenAI Files - uploadFile (stream data) › should omit expiry fields on stream uploads without expiresAfter", issue = 275, reason = "UploadFileData has no stream variant" },
  { case = "OpenAI Files - uploadFile (stream data) › should stream a multipart upload with fields preceding the file part", issue = 275, reason = "UploadFileData has no stream variant" },
]

