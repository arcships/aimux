[google.files.tests]
sub-feature = [
  { case = "GoogleFiles › uploadFile › should thread per-call headers and abortSignal through the upload", issue = 275, reason = "UploadFileCallOptions has no per-call headers or abort signal" },
]
ts-only = [
  { case = "GoogleFiles › uploadFile › should preserve ArrayBuffer-backed upload data", reason = "asserts that the same Uint8Array view reaches fetch (object identity of a typed-array view); Rust upload data is an owned Vec<u8>" },
  { case = "GoogleFiles › uploadFile › should reject stream data at runtime and cancel the stream", reason = "a ReadableStream passed where the type forbids it is a JS runtime check; UploadFileData has no stream variant, so Rust cannot express the input" },
]

