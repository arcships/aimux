# Upstream file map for aimux-providers (RFC-0046 §4.4, RFC-0045 §3).
# One table per vendor with an upstream package; versions come from
# fixtures/aisdk/VERSIONS.json. `rust` paths are relative to src/.

[mistral]
package = "@ai-sdk/mistral"

[[mistral.files]]
upstream = "src/convert-mistral-usage.ts"
rust = "mistral/model.rs"
status = "mapped"

[mistral.files.tests]
ts-only = [
  { case = "convertMistralUsage › should return undefined values when usage is null", reason = "convert_usage takes a non-null usage; a missing usage is an Option at the call site, and a stream without usage ends with Usage::default()" },
]

