# Upstream file map for aimux-providers (RFC-0046 §4.4, RFC-0045 §3).
# One table per vendor with an upstream package; versions come from
# fixtures/aisdk/VERSIONS.json. `rust` paths are relative to src/.

[bedrock]
package = "@ai-sdk/amazon-bedrock"
# amazon-bedrock-chat-language-model-event-stream.test.ts and amazon-bedrock-usage-raw.test.ts
# have no source file of their own name; every case in them is ported, so they need no
# exclusions.

[[bedrock.files]]
upstream = "src/amazon-bedrock-anthropic-model-support.ts"
rust = "bedrock/convert.rs"
status = "mapped"

[bedrock.files.tests]

[[bedrock.files]]
upstream = "src/amazon-bedrock-api-types.ts"
rust = "bedrock/types.rs"
status = "mapped"

[bedrock.files.tests]
sub-feature = [
  { case = "createAmazonBedrockCachePoint › should return default cache point when no TTL is provided", issue = 275, reason = "no createAmazonBedrockCachePoint builder; a cache point is passed verbatim through providerOptions.amazonBedrock.cachePoint" },
  { case = "createAmazonBedrockCachePoint › should create cache point with 5m TTL", issue = 275, reason = "no createAmazonBedrockCachePoint builder; a cache point is passed verbatim through providerOptions.amazonBedrock.cachePoint" },
  { case = "createAmazonBedrockCachePoint › should create cache point with 1h TTL", issue = 275, reason = "no createAmazonBedrockCachePoint builder; a cache point is passed verbatim through providerOptions.amazonBedrock.cachePoint" },
]

