[[bedrock.files]]
upstream = "src/amazon-bedrock-sigv4-fetch.ts"
rust = "bedrock/mod.rs"
status = "mapped"

[bedrock.files.tests]
registered = [
  { case = "createSigV4FetchFunction › should bypass signing for non-POST requests", ref = "AWS SigV4 fetch 也给 GET 请求签名（§9.1 已知差距）", reason = "aimux signs every request that carries no API key, GET included, so that list_models is accepted" },
  { case = "createSigV4FetchFunction › should bypass signing if POST request has no body", ref = "AWS SigV4 fetch 也给 GET 请求签名（§9.1 已知差距）", reason = "aimux signs every request that carries no API key, a bodyless POST included" },
  { case = "createSigV4FetchFunction › should call original fetch if init is undefined", ref = "AWS SigV4 fetch 也给 GET 请求签名（§9.1 已知差距）", reason = "a request with no init is a GET, which upstream forwards unsigned; aimux signs it" },
]
ts-only = [
  { case = "createSigV4FetchFunction › should handle non-string body by stringifying it", reason = "FetchRequest.body is bytes; there is no JS object body for JSON.stringify to coerce" },
  { case = "createApiKeyFetchFunction › should handle empty string API key", reason = "createApiKeyFetchFunction is a TS module export; the Rust provider sends a non-blank key as a header and has no fetch factory to hand an empty key" },
]

