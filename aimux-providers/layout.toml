# Upstream file map for aimux-providers (RFC-0046 §4.4, RFC-0045 §3).
# One table per vendor with an upstream package; versions come from
# fixtures/aisdk/VERSIONS.json. `rust` paths are relative to src/.

[anthropic]
package = "@ai-sdk/anthropic"
# anthropic-message-lifecycle.test.ts and anthropic-unknown-model-max-output-tokens.test.ts
# have no source file of their own name; every case in them is ported, so they need no
# exclusions.

[[anthropic.files]]
upstream = "src/anthropic-api.ts"
rust = "anthropic/api.rs"
status = "mapped"

[anthropic.files.tests]

[[anthropic.files]]
upstream = "src/anthropic-batch.ts"
status = "missing"
issue = 275
reason = "no Message Batches API (#275 Anthropic Message Batches)"

[[anthropic.files]]
upstream = "src/anthropic-error.ts"
rust = "anthropic/error.rs"
status = "mapped"

[anthropic.files.tests]
ts-only = [
  { case = "anthropicError › anthropicErrorDataSchema › should parse overloaded error", reason = "tests the exported zod schema; anthropic_failed_response_handler reads the error JSON without a schema (the overloaded error itself is covered by the doGenerate and doStream 529 cases)" },
]

[[anthropic.files]]
upstream = "src/anthropic-files.ts"
rust = "anthropic/files.rs"
status = "mapped"

[anthropic.files.tests]
sub-feature = [
  { case = "AnthropicFiles › uploadFile › threads per-call headers and abortSignal", issue = 275, reason = "UploadFileCallOptions has no per-call headers or abort signal" },
]
ts-only = [
  { case = "AnthropicFiles › uploadFile › rejects stream data at runtime and cancels the stream", reason = "a ReadableStream passed where the type forbids it is a JS runtime check; UploadFileData has no stream variant, so Rust cannot express the input" },
]

