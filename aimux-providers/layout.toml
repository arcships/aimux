  { case = "OpenResponsesLanguageModel › doGenerate › manual history replay › should decode and losslessly replay an explicitly registered bare item", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doGenerate › manual history replay › should replay a source-only extension item through response history", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doGenerate › manual history replay › should encode bare extension history when original wire metadata is unavailable", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doGenerate › manual history replay › should encode client-executed extension calls and results without original wire metadata", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doGenerate › tools › should encode registered provider tools and preserve warnings for unregistered tools", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doGenerate › tools › should encode explicitly registered bare provider tools and tool choices", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doGenerate › tools › should warn and omit a registered provider tool and its selected choice when it cannot be encoded", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doStream › should decode registered extension events and completed items", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doStream › should decode explicitly registered bare extension events and completed items", issue = 275, reason = "the extension registry (open-responses-extension.ts) is not ported" },
  { case = "OpenResponsesLanguageModel › doStream › should use complete custom tool input from $source when deltas are omitted", issue = 275, reason = "custom tools (customToolId, open-responses-tools.ts) are not ported" },
