# Upstream file map for aimux-providers (RFC-0046 §4.4, RFC-0045 §3).
# One table per vendor with an upstream package; versions come from
# fixtures/aisdk/VERSIONS.json. `rust` paths are relative to src/.

[openai]
package = "@ai-sdk/openai"
# openai-evaluation, openai-forward-compatible-defaults, responses/openai-responses-computer,
# responses/openai-responses-reasoning-effort-update and
# responses/convert-to-openai-responses-input-tool-search have no source file of their own
# name; their exclusions sit under the source file they test.

