  { case = "convertToOpenResponsesInput › assistant messages › should use an easy input message without generating an ID in strict mode", issue = 275, reason = "OpenResponsesProviderSettings has no strictResponseInput" },
  { case = "custom tool results › preserves text, images, and files in custom tool history", issue = 275, reason = "custom tools (customToolId, open-responses-tools.ts) are not ported" },
  { case = "custom tool results › warns when a custom tool result contains unsupported provider file references", issue = 275, reason = "custom tools (customToolId, open-responses-tools.ts) are not ported" },
]

